
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Build binary
        if: github.event_name == 'push'
        run: go build -o cerofetch .

      - name: Commit binary
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cerofetch
          if ! git diff --cached --quiet; then
            git commit -m "build: update cerofetch binary"
            git push
          fi
